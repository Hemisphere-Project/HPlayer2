# /boot/hplayer2.conf — kxkm (25-kxkm): every player is a peer of one Zyre mesh
# Copy to /boot/hplayer2.conf on a card that runs hplayer2@auto (or hplayer2@25-kxkm).
# Keys and rules: core/engine/bootconf.py. The show's own data stays in /data/sync/25-kxkm
# (etendard.json, group.json), as before.

[player]
profile = 25-kxkm

[sync]
# iface binds the mesh. Absent = as before: wint for an etendard (video over Art-Net),
# Zyre's own choice for an HDMI player. Name one to pin it, e.g. the wired show LAN:
# iface = eth0
# no role / wall: a mesh has neither (a conf that sets one is reported, never obeyed)

# no [schedule] / [interfaces]: kxkm runs no playback window, keypad, teleco2 or Nowde
