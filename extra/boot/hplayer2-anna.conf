# /boot/hplayer2.conf — anna (26-anna): every player elects its leader, no master/slave
# Copy to /boot/hplayer2.conf on a card that runs hplayer2@auto (or hplayer2@26-anna).
# Keys and rules: core/engine/bootconf.py. No conf = wint if present, else wlan0, as before.

[player]
profile = 26-anna

[sync]
iface = auto                ; the first of wint (7.3+ internal Wi-Fi), wlan0, wlan1
# no role key: anna's role is always elected

[interfaces]
keypad  = yes               ; the LCD keypad
teleco2 = yes               ; the CoreS3 remote (USB or Wi-Fi)
# nowde / [schedule]: anna runs neither
