# /boot/hplayer2.conf — biennale, wired sync MASTER (one per wall)
# Copy to /boot/hplayer2.conf on a card that runs hplayer2@auto (or hplayer2@biennale).
# Keys and rules: core/engine/bootconf.py. No conf = the /boot/wifi markers, as before.

[player]
profile = biennale

[sync]
iface = eth0                ; the wall's own cable
role  = master
wall  = yes                 ; continuous frame-lock (the profile's WALL_SYNC)

[schedule]
# no `enabled` key = the window is loaded and stays off until the web UI turns it on (as before)
# enabled = yes             ; gate a fresh card from its first boot
# enabled = no              ; no playback window and no daily reboot at all
require_rtc = yes           ; never gate on a clock that is not a real RTC
# `enabled = yes` and the window keys below only SEED a card with no saved
# /data/hplayer2-biennale.cfg; once the web UI has saved one, it wins.
# Values shown are the interface's defaults.
# open   = 10:00
# close  = 19:00
# days   = 1111111          ; Monday first, 1 = open that day
# reboot = no

[interfaces]
nowde = yes                 ; keypad / teleco2: biennale runs neither
